mapf:
  mapf_costmap:
    mapf_costmap:
      ros__parameters:
        use_sim_time: True

        map_type: costmap
        origin_z: 0.0
        z_resolution: 1.0
        z_voxels: 2.0

        obstacle_range: 10.0
        raytrace_range: 10.1

        publish_voxel_map: false
        transform_tolerance: 0.3
        meter_scoring: true

        footprint: "[[0.48, -0.40], [0.48, 0.40], [-0.48, 0.40], [-0.48, -0.40]]"
        footprint_padding: 0.1

        global_frame: map

        # choose one of "base_link" frame of the agents 
        robot_base_frame: rb_0/base_link

        update_frequency: 1.0
        publish_frequency: 1.0
        width: 60
        height: 60
        resolution: 0.05
        origin_x: -30.0
        origin_y: -30.0
        static_map: True
        track_unknown_space: true

          
        plugins: ["static_layer"]
        
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
          map_topic: mapf_base/map

        static_layer:
          map_topic: mapf_base/map
          first_map_only: true
        
        always_send_full_costmap: True