mapf:
  map_server:
    ros__parameters:
      use_sim_time: True

mapf:
  mapf_base_node:
    ros__parameters:
      use_sim_time: true
      # the number of agents
      agent_num: 2
      # global frame_id in /tf
      global_frame_id: map

      # if the time limit is exceeded, the algorithm will automatically exit
      planner_time_tolerance: 5.0

      # mapf_base node will execute mapf algorithm in a loop until the goal is reached, 
      # this parameter is better set to be the same as the map resolution
      goal_tolerance: 1.0

      # ecbs
      ecbs:
        suboptimality: 1.2

      # the frame_id for each agent in the map
      base_frame_id:
        agent_0: rb_0/base_link
        agent_1: rb_1/base_link

      # plan_topic will be used to publish gui path in rviz
      plan_topic:
        agent_0: rb_0/plan
        agent_1: rb_1/plan


mapf:
  plan_executor:
    ros__parameters:
      use_sim_time: true

      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.2

      # topic "(arg agent_name)/move_base/goal" will be send to move_base
      agent_num: 2
      agent_name:
        agent_0: rb_0
        agent_1: rb_1
      
      global_frame_id: map

      base_frame_id:
        agent_0: rb_0/base_link
        agent_1: rb_1/base_link

      plan_topic:
        agent_0: rb_0/plan
        agent_1: rb_1/plan

mapf:
  goal_transformer:
    ros__parameters:
      use_sim_time: true
      # used to receive goal for each agent
      agent_num: 2
      goal_topic:
        agent_0: rb_0/goal
        agent_1: rb_1/goal